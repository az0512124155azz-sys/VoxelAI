name: Build & Release VoxelAI Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-windows:
    name: 🪟 Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run build:win -- --publish never
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: dist/*.exe

  build-macos:
    name: 🍎 macOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build macOS DMG
        run: npm run build:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: dist/*.dmg

  build-linux:
    name: 🐧 Linux Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - name: Install Node dependencies
        run: npm ci
      - name: Build Linux packages
        run: npm run build:linux -- --publish never
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  release:
    name: 🚀 Create Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release-assets/**/*
          body: |
            ## 🚀 VoxelAI Studio Release ${{ steps.tag.outputs.name }}

            ### Download for your platform:
            | Platform | File |
            |---|---|
            | 🪟 Windows | `VoxelAI-Studio-Setup-*.exe` |
            | 🍎 macOS Intel | `VoxelAI-Studio-*-x64.dmg` |
            | 🍎 macOS Apple Silicon | `VoxelAI-Studio-*-arm64.dmg` |
            | 🐧 Linux AppImage | `VoxelAI-Studio-*.AppImage` |
            | 🐧 Linux Debian | `voxelai-studio_*.deb` |
            | 🐧 Linux RPM | `voxelai-studio-*.rpm` |

            ### What's new:
            - See [CHANGELOG.md](CHANGELOG.md)

            ### Quick Start:
            1. Download the installer for your OS
            2. Install and launch VoxelAI Studio
            3. Optionally set up a local AI engine for real 3D generation
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
